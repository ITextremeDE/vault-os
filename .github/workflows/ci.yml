name: Acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Check portability
        run: python scripts/check_portability.py
      - name: Validate portability matrix
        run: python scripts/validate_portability_matrix.py
      - name: Validate manifests
        run: python scripts/validate_manifests.py
      - name: Check whitespace
        run: git diff --check
