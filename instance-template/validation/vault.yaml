schema: 1

excludePathParts:
  - .git
  - .obsidian
  - .trash
  - .vault-os
  - .agents
  - .claude
  - .codex
  - .qmd

frontmatter:
  enabled: true
  include:
    - "**/*.md"
  exclude:
    - "{system}/**"
    - "AGENTS.md"
    - "CLAUDE.md"
  fields: Vault-OS/schema/fields.yaml
  models:
    - "{system}/01 Schema/Models/*.json"
  registers:
    areas: Vault-OS/registers/areas.yaml
    relationships: Vault-OS/modules/contacts/registers/relationships.yaml
    relevance: Vault-OS/modules/contacts/registers/relevance.yaml

links:
  enabled: true
  requireFullWikiPaths: true

git:
  sizeReport: false
